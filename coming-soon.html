<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | VACCUMSTACK</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body class="auth-page">
    <div class="auth-toggles" style="position: absolute; top: 2rem; right: 2rem; display: flex; gap: 1rem; z-index: 10;">
        <a href="dashboard.html" class="icon-btn" title="Dashboard"><i data-lucide="layout-grid"></i></a>
        <button id="themeToggle" class="icon-btn" title="Toggle theme"><i data-lucide="sun"></i></button>
        <button id="rtlToggle" class="icon-btn" title="Toggle RTL"><i data-lucide="arrow-left-right"></i></button>
    </div>

    <div class="auth-bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="scan-line"></div>
    </div>

    <div class="auth-card-new" style="max-width: 500px;">
        <div class="auth-status">STATUS: DEPLOYMENT_PENDING</div>
        <div class="mb-5 mt-4">
            <div style="color: var(--accent-primary); margin-bottom: 1.5rem;">
                <i data-lucide="rocket" size="48"></i>
            </div>
            <h3 class="fw-bold mb-3">Module In Development</h3>
            <p class="text-muted small mb-4">This section of the platform is currently undergoing rigorous performance testing and tuning. It will be deployed to production shortly.</p>
            
            <form action="#" class="mb-4">
                <div class="text-start mb-3">
                    <label class="mono xsmall text-muted mb-2 d-block">NOTIFY ON DEPLOYMENT</label>
                    <div style="position: relative; display: flex; gap: 0.5rem;">
                        <input type="email" class="form-control" placeholder="engineering@company.com" required style="flex: 1;">
                        <button type="submit" class="btn btn-primary" style="padding: 0 1.5rem;"><i data-lucide="send" size="18"></i></button>
                    </div>
                </div>
            </form>

            <a href="index.html" class="btn btn-outline w-100">RETURN TO HOME</a>
        </div>

        <div class="mt-4 pt-3 border-top border-secondary opacity-50">
            <a href="index.html" class="logo justify-content-center" style="font-size: 1.2rem;">
                <i data-lucide="zap"></i> VACCUMSTACK
            </a>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
